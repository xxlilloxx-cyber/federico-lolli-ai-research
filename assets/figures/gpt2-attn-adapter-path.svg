<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Correct GPT-2 attention output adapter insertion</title><desc id="d">The concatenated attention output branches into frozen attn.c_proj and the trainable adapter. Their outputs are summed before GPT-2 residual dropout and residual addition.</desc><style>text{font-family:Arial,sans-serif;fill:#15233c}.h{font-size:25px;font-weight:700}.s{font-size:18px}.f{font:18px monospace}.fr{fill:#f2f5f9;stroke:#526176;stroke-width:2}.tr{fill:#eaf3ff;stroke:#125cb6;stroke-width:3}.sum{fill:#ecfaf4;stroke:#08795a;stroke-width:3}.a{stroke:#526176;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#526176"/></marker></defs><text x="600" y="38" text-anchor="middle" class="h">Final-study adapter location in a zero-based GPT-2 block</text><text x="600" y="66" text-anchor="middle" class="s">Block 0 is the first Transformer block (zero-based indexing). Frozen modules are gray; trainable adapter is blue.</text><rect x="35" y="130" width="165" height="70" rx="10" class="fr"/><text x="118" y="160" text-anchor="middle" class="h">Block input</text><text x="118" y="187" text-anchor="middle" class="s">hidden states</text><path d="M200 165H250" class="a"/><rect x="255" y="130" width="135" height="70" rx="10" class="fr"/><text x="322" y="160" text-anchor="middle" class="h">LN_1</text><text x="322" y="187" text-anchor="middle" class="s">frozen</text><path d="M390 165H440" class="a"/><rect x="445" y="110" width="220" height="110" rx="10" class="fr"/><text x="555" y="145" text-anchor="middle" class="h">Q / K / V</text><text x="555" y="174" text-anchor="middle" class="s">causal attention</text><text x="555" y="201" text-anchor="middle" class="s">concatenate heads: z</text><path d="M665 165H720V290H440" class="a"/><path d="M665 165H720V290H790" class="a"/><rect x="190" y="250" width="245" height="82" rx="10" class="fr"/><text x="312" y="282" text-anchor="middle" class="h">frozen attn.c_proj</text><text x="312" y="310" text-anchor="middle" class="f">zW + b</text><rect x="795" y="235" width="250" height="112" rx="10" class="tr"/><text x="920" y="267" text-anchor="middle" class="h">trainable adapter</text><text x="920" y="297" text-anchor="middle" class="f">(α/r)(zU)²P</text><text x="920" y="325" text-anchor="middle" class="s">or LoRA baseline</text><path d="M435 291H555V405" class="a"/><path d="M795 291H675V405" class="a"/><rect x="470" y="410" width="290" height="72" rx="10" class="sum"/><text x="615" y="440" text-anchor="middle" class="h">sum: zW + b + Δy</text><text x="615" y="467" text-anchor="middle" class="s">then GPT-2 residual dropout</text><path d="M615 482V530" class="a"/><rect x="430" y="535" width="370" height="72" rx="10" class="sum"/><text x="615" y="565" text-anchor="middle" class="h">attention residual addition</text><text x="615" y="592" text-anchor="middle" class="s">LN_2 → frozen MLP → MLP residual</text><path d="M118 200V570H425" class="a"/></svg>
