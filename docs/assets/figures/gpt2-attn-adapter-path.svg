<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc"><title id="title">GPT-2 Transformer block path with adapter inserted at attention output projection</title><desc id="desc">A GPT-2 block diagram from input hidden states through normalization, Q K V projections, attention, frozen attention output projection, adapter correction, residual connection, and MLP.</desc><style>text{font-family:Arial,sans-serif;fill:#15233c}.h{font-size:29px;font-weight:700}.s{font-size:19px}.m{font-size:17px}.f{font-family:monospace;font-size:18px}.b{fill:#fff;stroke:#b9c9dd;stroke-width:2}.frozen{fill:#f3f6fa;stroke:#526176;stroke-width:2}.train{fill:#eaf3ff;stroke:#125cb6;stroke-width:3}.res{fill:#ecfaf4;stroke:#08795a;stroke-width:3}.a{stroke:#526176;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L10,3L0,6Z" fill="#526176"/></marker></defs>
<text x="620" y="45" text-anchor="middle" class="h">Final study insertion point inside one GPT-2 Transformer block</text><text x="620" y="75" text-anchor="middle" class="s">The final 5,000-step study adapts only the frozen attention output projection, attn.c_proj.</text>
<rect x="70" y="125" width="180" height="76" rx="12" class="b"/><text x="160" y="158" text-anchor="middle" class="h">Input x</text><text x="160" y="184" text-anchor="middle" class="m">hidden states</text><line x1="250" y1="163" x2="305" y2="163" class="a"/>
<rect x="310" y="125" width="190" height="76" rx="12" class="frozen"/><text x="405" y="155" text-anchor="middle" class="h">LayerNorm</text><text x="405" y="184" text-anchor="middle" class="m">frozen GPT-2</text><line x1="500" y1="163" x2="555" y2="163" class="a"/>
<rect x="560" y="105" width="220" height="116" rx="12" class="frozen"/><text x="670" y="140" text-anchor="middle" class="h">Q / K / V</text><text x="670" y="169" text-anchor="middle" class="m">frozen projections</text><text x="670" y="196" text-anchor="middle" class="m">+ causal attention</text><line x1="780" y1="163" x2="835" y2="163" class="a"/>
<rect x="840" y="125" width="180" height="76" rx="12" class="frozen"/><text x="930" y="155" text-anchor="middle" class="h">Concat heads</text><text x="930" y="184" text-anchor="middle" class="m">attention output</text>
<line x1="930" y1="202" x2="930" y2="272" class="a"/><rect x="810" y="278" width="240" height="88" rx="12" class="frozen"/><text x="930" y="315" text-anchor="middle" class="h">attn.c_proj</text><text x="930" y="344" text-anchor="middle" class="m">frozen base: y₀ = xW</text>
<line x1="808" y1="322" x2="636" y2="322" class="a"/><rect x="345" y="250" width="286" height="145" rx="12" class="train"/><text x="488" y="285" text-anchor="middle" class="h">Trainable adapter</text><text x="488" y="318" text-anchor="middle" class="f">Δy = α(xU)²P</text><text x="488" y="350" text-anchor="middle" class="m">Symmetric Quadratic, or</text><text x="488" y="375" text-anchor="middle" class="f">Δy = α(xA)B</text><text x="488" y="398" text-anchor="middle" class="m">LoRA baseline</text>
<line x1="930" y1="366" x2="930" y2="448" class="a"/><line x1="488" y1="396" x2="488" y2="448" class="a"/><rect x="710" y="452" width="440" height="80" rx="12" class="res"/><text x="930" y="485" text-anchor="middle" class="h">Add correction and residual connection</text><text x="930" y="514" text-anchor="middle" class="f">y = y₀ + Δy; then + x</text>
<line x1="930" y1="532" x2="930" y2="594" class="a"/><rect x="750" y="600" width="360" height="88" rx="12" class="frozen"/><text x="930" y="635" text-anchor="middle" class="h">LayerNorm → MLP → residual</text><text x="930" y="664" text-anchor="middle" class="m">frozen in the final long-run campaign</text><path d="M160 201V492H707" class="a"/><text x="250" y="475" class="m">residual path</text>
</svg>
