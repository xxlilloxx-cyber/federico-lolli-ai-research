<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Three fixed budget placement geometries across twelve GPT-2 blocks</title><desc id="desc">The same 12,288 adapter parameters are arranged as a single rank 8 adapter in block 2, two rank 4 adapters in blocks 0 and 11, or four rank 2 adapters in blocks 0, 3, 7, and 11.</desc><style>text{font-family:Arial,sans-serif;fill:#15233c}.h{font-size:27px;font-weight:700}.s{font-size:18px}.m{font-size:16px}.box{fill:#f4f7fb;stroke:#b9c9dd;stroke-width:1.5}.on{fill:#eaf3ff;stroke:#125cb6;stroke-width:3}.lab{font-size:15px;font-family:monospace}</style><text x="600" y="45" text-anchor="middle" class="h">Same total parameter budget, different distributions across depth</text><text x="600" y="75" text-anchor="middle" class="s">Every row has 12,288 trainable adapter parameters in frozen attn.c_proj modules.</text>
<text x="50" y="112" class="h">Concentrated</text><text x="430" y="112" class="h">Two-layer</text><text x="810" y="112" class="h">Four-layer</text>
<g transform="translate(50 130)"><rect class="box" width="300" height="25" rx="5"/><text x="12" y="18" class="m">Block 0</text><rect class="box" y="31" width="300" height="25" rx="5"/><text x="12" y="49" class="m">Block 1</text><rect class="on" y="62" width="300" height="25" rx="5"/><text x="12" y="80" class="m">Block 2</text><text x="260" y="80" class="lab">r=8</text><rect class="box" y="93" width="300" height="211" rx="5"/><text x="12" y="122" class="m">Blocks 3–11 unchanged</text></g>
<g transform="translate(430 130)"><rect class="on" width="300" height="25" rx="5"/><text x="12" y="18" class="m">Block 0</text><text x="260" y="18" class="lab">r=4</text><rect class="box" y="31" width="300" height="304" rx="5"/><text x="12" y="60" class="m">Blocks 1–10 unchanged</text><rect class="on" y="341" width="300" height="25" rx="5"/><text x="12" y="359" class="m">Block 11</text><text x="260" y="359" class="lab">r=4</text></g>
<g transform="translate(810 130)"><rect class="on" width="300" height="25" rx="5"/><text x="12" y="18" class="m">Block 0</text><text x="260" y="18" class="lab">r=2</text><rect class="box" y="31" width="300" height="56" rx="5"/><text x="12" y="60" class="m">Blocks 1–2 unchanged</text><rect class="on" y="93" width="300" height="25" rx="5"/><text x="12" y="111" class="m">Block 3</text><text x="260" y="111" class="lab">r=2</text><rect class="box" y="124" width="300" height="87" rx="5"/><text x="12" y="153" class="m">Blocks 4–6 unchanged</text><rect class="on" y="217" width="300" height="25" rx="5"/><text x="12" y="235" class="m">Block 7</text><text x="260" y="235" class="lab">r=2</text><rect class="box" y="248" width="300" height="87" rx="5"/><text x="12" y="277" class="m">Blocks 8–10 unchanged</text><rect class="on" y="341" width="300" height="25" rx="5"/><text x="12" y="359" class="m">Block 11</text><text x="260" y="359" class="lab">r=2</text></g>
<text x="200" y="550" text-anchor="middle" class="s">one adapter × rank 8</text><text x="580" y="550" text-anchor="middle" class="s">two adapters × rank 4</text><text x="960" y="550" text-anchor="middle" class="s">four adapters × rank 2</text></svg>
