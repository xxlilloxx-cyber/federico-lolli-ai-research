<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Progression of adapter functions evaluated in Research Project 01</title><desc id="desc">A readable progression from frozen projection to low rank linear, feature-wise quadratic, feature interaction, symmetric quadratic, and combined adapters.</desc>
<style>text{font-family:Arial,sans-serif;fill:#15233c}.h{font-size:28px;font-weight:700}.s{font-size:19px}.f{font-size:22px;font-family:monospace}.box{fill:#fff;stroke:#b9c9dd;stroke-width:2}.blue{fill:#eaf3ff;stroke:#125cb6;stroke-width:3}.arrow{stroke:#526176;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L10,3L0,6Z" fill="#526176"/></marker></defs>
<text x="600" y="48" text-anchor="middle" class="h">Adapter functions examined in Research Project 01</text><text x="600" y="80" text-anchor="middle" class="s">All are trainable corrections added to a frozen GPT-2 projection; they are not new GPT-2 models.</text>
<rect x="70" y="125" width="1060" height="92" rx="14" class="box"/><text x="105" y="164" class="h">Frozen projection</text><text x="105" y="198" class="f">y = xW</text><text x="420" y="168" class="s">The pretrained weight W remains frozen. An adapter adds Δy.</text>
<line x1="600" y1="218" x2="600" y2="257" class="arrow"/>
<rect x="70" y="270" width="510" height="130" rx="14" class="blue"/><text x="100" y="310" class="h">Linear low-rank: LoRA</text><text x="100" y="346" class="f">Δy = (α/r)(xA)B</text><text x="100" y="380" class="s">A low-rank linear correction to the projection output.</text>
<rect x="620" y="270" width="510" height="130" rx="14" class="box"/><text x="650" y="310" class="h">Element-wise quadratic</text><text x="650" y="346" class="f">Δy = (α/r)(x ⊙ x)UV</text><text x="650" y="380" class="s">Adds separate xᵢ² terms, without feature cross-products.</text>
<rect x="70" y="450" width="510" height="150" rx="14" class="box"/><text x="100" y="490" class="h">Feature interaction</text><text x="100" y="526" class="f">Δy = (α/r)[(xU) ⊙ (xV)]P</text><text x="100" y="560" class="s">Latent products contain xᵢxⱼ terms across input features.</text>
<rect x="620" y="450" width="510" height="150" rx="14" class="blue"/><text x="650" y="490" class="h">Symmetric quadratic</text><text x="650" y="526" class="f">Δy = (α/r)(xU)²P</text><text x="650" y="560" class="s">The final long-run comparison: low-rank symmetric quadratic forms.</text>
<text x="600" y="655" text-anchor="middle" class="s">Earlier work also evaluated signed quadratic x|x| and a combined linear + quadratic adapter.</text>
</svg>
